[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quickmapgo"
version = "0.1.0"
description = "Painel local de simulação de localização para iPhone"
requires-python = ">=3.12"
dependencies = ["streamlit==1.65.0"]

[project.optional-dependencies]
device = ["pymobiledevice3==11.20.2"]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
quickmapgo-agent = "quickmapgo.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quickmapgo = ["ui/map/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
